<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee5;color:#4d3827;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

<style>
#activityNotice{max-width:760px;margin:16px auto 12px;padding:15px 18px;border:1px solid #dfc9ac;border-radius:14px;background:#fffaf0;color:#6a4936;text-align:center;line-height:1.8}

<section id="meritIntro" style="max-width:760px;margin:22px auto 16px;padding:24px 20px 20px;text-align:center;background:#fffaf2;border:1px solid #e5d8c7;border-radius:16px;color:#604431;">
  <div style="font-size:13px;letter-spacing:2px;color:#927255;margin-bottom:10px;">2026 · 咖提那庆典</div>
  <h1 style="font-size:clamp(23px,5.5vw,30px);line-height:1.5;margin:0 0 12px;color:#684331;">随喜功德卡</h1>

</section>

  <div style="font-size:18px;font-weight:600;color:#6e493d;margin-bottom:12px;">① 选择供养方向</div>

    <button type="button" data-cat="衣">衣</button><button type="button" data-cat="食">食</button>
    <button type="button" data-cat="住">住</button><button type="button" data-cat="药">药</button>
    <button type="button" data-cat="学">学</button><button type="button" data-cat="僧">僧</button>
  </div>
  <div style="font-size:18px;font-weight:600;color:#6e493d;margin-bottom:10px;">② 选择具体项目</div>
  <select id="projectSelect" style="width:100%;padding:12px 14px;border:1px solid #d8c8b5;border-radius:10px;background:white;font-size:16px;">
    <option>2026 咖提那功德衣</option>
  </select>
  <div id="projectHint" style="margin-top:10px;font-size:13px;color:#8a7768;">六大方向固定；具体项目按实际活动增减，不再拆到费用明细。</div>
</div>
<style>
#categoryButtons button{padding:11px 4px;border:1px solid #d8c8b5;border-radius:10px;background:#fff;color:#705044;font-size:17px;cursor:pointer}
#categoryButtons button.active{background:#7b3f45;color:#fff;border-color:#7b3f45}
@media(max-width:600px){#categoryButtons{grid-template-columns:repeat(3,1fr)!important}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const projects={
  '衣':['2026 咖提那功德衣','衣物供养'],
  '食':['饮食供养'],
  '住':['住处护持'],
  '药':['医药供养'],
  '学':['修学护持','佛法翻译','修学平台与技术','书籍与学习资料'],
  '僧':['僧团护持','比库护持']
 };
 const sel=document.getElementById('projectSelect');
 const buttons=[...document.querySelectorAll('#categoryButtons button')];
 function choose(cat){
   buttons.forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
   sel.innerHTML='';
   projects[cat].forEach(p=>{const o=document.createElement('option');o.textContent=p;sel.appendChild(o)});
   window.selectedOfferingProject = sel.value;
 }
 sel.addEventListener('change',()=>{ window.selectedOfferingProject = sel.value; });
 buttons.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.cat)));
 choose('衣');
});
</script>

<script>
(function(){
  "use strict";
  const cfg=window.MERIT_ACTIVITY;
  const open=Date.parse(cfg.openAt), close=Date.parse(cfg.closeAt);
  const notice=document.getElementById("activityNotice");
  const btn=document.getElementById("make");
  const good=Number.isFinite(open)&&Number.isFinite(close)&&open<close;
  const fmt=t=>new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(t));
  // 仅供上线前功能测试：公开测试参数，不是密码或访问控制。
  const preview=new URLSearchParams(location.search).get("preview")==="1";
  window.meritIsOpen=()=>preview || (good && Date.now()>=open && Date.now()<close);
  function render(){
    const now=Date.now(),active=window.meritIsOpen();
    document.body.classList.toggle("activity-closed",!preview && good && now>=close);
    document.body.classList.toggle("activity-before",!preview && good && now<open);
    if(preview){
      notice.innerHTML="<strong>管理员测试模式</strong><div>仅用于检查生成和保存功能，请勿向学习群分享此测试链接。</div>";
    }else if(!good){
      notice.innerHTML="<strong>活动时间尚未正确设置</strong>请管理员先配置开放和结束日期。";
    }else if(now<open){
      notice.textContent="";
    }else if(now>=close){
      notice.innerHTML="<strong>2026年咖提那庆典圆满结束</strong><div class=\"ending-line\">感谢您的随喜与参与！</div><div class=\"ending-wish\">愿此善业成为解脱之缘。</div><div class=\"ending-sadhu\">萨度！萨度！萨度！</div>";
    }else{
      const days=Math.ceil((close-now)/86400000);
      notice.innerHTML="<strong>庆典随喜功德卡 · 限时开放</strong>开放至北京时间 "+fmt(close)+"<div>剩余约 "+days+" 天 · 欢迎生成个人随喜纪念卡</div>";
    }
    btn.disabled=!active;
    btn.style.opacity=active?"1":".55";
  }
  // 只发送匿名事件、供养类别及项目，不发送姓名/法名、金额、Cookie 或设备标识。
  window.meritTrack=function(type,category="",project=""){
    if(preview || !["view","generate"].includes(type))return;
    try{
      fetch("/api/track",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({type,category,project}),keepalive:true,credentials:"omit"})
        .catch(()=>{});
    }catch(_){}
  };
  render();
  // 页面打开只计一次；刷新可能再次计数，属于访问次数而非独立人数。
  window.meritTrack("view");
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)render()});
  setInterval(render,60000);
})();
</script>
